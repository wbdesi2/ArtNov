  <!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Verificación - ArtNov</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="css/changepss.css"
rel="stylesheet">

</head>

<body>

<section class="pull-to-refresh">
    <div class="spinner-border text-light"
         role="status">
    </div>
</section>

<div class="screen">


    <div class="logo">
        <img src="img/Space-Age-3.png"
             alt="ARTNOV" width="288" height="168">
    </div>


    <h2>
        Revisa tu número ******00
    </h2>

    <p class="description">
        Te mandaremos un código a tu número telefónico,
        al tenerlo ingrésalo aquí para continuar.
    </p>

 

    <p class="timer">
        El código se reenviará en
        <span id="countdown">30</span>
        segundos
    </p>


 <div class="change">

    <input
        type="text"
        class="code"
        maxlength="4"
        placeholder="Ingrese código">

</div>

    <!-- BOTON -->

    <button
	id="continueBtn"
class="green-btn1"
onclick="location.href='new-ps.html'"
disabled>
		

Cambiar Contraseña

</button>



    <a href="#"
       class="resend"
       onclick="restartTimer(event)">

       <i class="fa-solid fa-rotate-right"></i>
       Reenviar código

    </a>

</div>

<script>

let count = 30;
let interval;

const timer =
document.getElementById(
"countdown"
);

function startTimer()
{
    clearInterval(interval);

    count = 30;

    timer.innerText = count;

    interval =
    setInterval(() =>
    {
        count--;

        timer.innerText = count;

        if(count <= 0)
        {
            clearInterval(interval);
        }

    },1000);
}

function restartTimer(event)
{
    event.preventDefault();

    startTimer();
}

startTimer();

const codes =
document.querySelectorAll(".code");

codes.forEach((input,index)=>
{
    input.addEventListener(
        "input",
        function()
        {
            if(
                this.value.length === 1 &&
                index < codes.length - 1
            )
            {
                codes[index + 1].focus();
            }
        }
    );
});

</script>
<script src="js/app.js"></script>

<script src="js/dis-button.js"></script>
</body>
</html>
