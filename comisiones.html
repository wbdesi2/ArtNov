<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Comisiones - ArtNov</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link
rel="stylesheet"
href="css/comisiones.css">

</head>

<body>

<div class="screen">

    <!-- HEADER -->

    <div class="top-bar">

        <button
        class="back-btn"
        onclick="history.back()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h1>
            Comisiones
        </h1>

    </div>


    <!-- BANNER -->

    <img
    src="img/uigyggyhghghggh.png"
    class="banner-img">


    <!-- LISTA -->

    <div class="commission-card">

        <h2>
            Lista de Precios
        </h2>

        <div class="price-item">

            <span>Chibi</span>

            <span>$10</span>

        </div>

        <div class="price-item">

            <span>Medio Cuerpo</span>

            <span>$20</span>

        </div>

        <div class="price-item">

            <span>Cuerpo Completo</span>

            <span>$35</span>

        </div>

        <div class="price-item">

            <span>Ilustración Completa</span>

            <span>$50</span>

        </div>

    </div>


    <!-- INFO -->

    <div class="info-card">

        <h3>
            Información
        </h3>

        <p>

            Tiempo estimado:
            3 - 7 días.

        </p>

        <p>

            Métodos de pago:

            PayPal,
            Transferencia,
            BAC.

        </p>

        <p>

            Se requiere el
            50% por adelantado.

        </p>

    </div>


    <!-- BOTON -->

    <button class="commission-btn" onclick="window.location.href='perfil.html'">

        Solicitar Comisión

    </button>


</div>

</body>
</html>
