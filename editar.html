<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Editar Publicación</title>
    <link rel="stylesheet" href="css/editar.css">
</head>

<body>

    <div class="phone">

        <header class="top">
            <button class="cancelar" onClick="location.href='ArtNov - Home.html'">Cancelar</button>
            <button class="publicar" onClick="location.href='ArtNov - Home.html'">Publicar</button>
        </header>

        <section class="user-row">
            <img src="img/ghbhhh.png" alt="Avatar">
            <input type="text" placeholder="¡Nuevo reside...">
            <button>Editar</button>
        </section>

        <section class="images">
            <div class="image-box">
                <img src="img/saaanprubesj.png" alt="Imagen">
                <span class="trash">🗑</span>
            </div>

            <div class="image-box">
                <img src="img/mist333.png" alt="Imagen">
            </div>
        </section>

        <hr>

        <section class="tags">
            <button>Tags</button>
            <span>conceptart</span>
            <span>oc</span>
            <span>digitalart</span>
        </section>

        <hr>

        <section class="settings">

            <div class="setting-row">
                <span>Comentarios</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Recuento de likes</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Compartir</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Promocionar post</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

        </section>

    </div>

    <script src="js/editar.js"></script>
</body>
</html>
